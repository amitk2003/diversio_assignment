<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIS Import Preview — Diversio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 2.5rem 3rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.4rem;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid #d0d5dd;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fafafa;
      cursor: pointer;
    }

    input[type="file"]:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.3rem;
      margin-bottom: 1.5rem;
    }

    button[type="submit"] {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover { background: #4338ca; }

    .error-box {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      color: #c0392b;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HRIS Import Preview</h1>
    <p class="subtitle">Upload your HRIS export CSV to inspect the import before it is written to the platform.</p>

    {% if error %}
    <div class="error-box" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <label for="csv_file">Select CSV file</label>
      <input type="file" id="csv_file" name="csv_file" accept=".csv" required>
      <p class="hint">Accepts UTF-8 CSV files with or without a byte-order mark.</p>
      <button type="submit">Preview Import</button>
    </form>
  </div>
</body>
</html>
